<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>데이터 삭제 안내 | 마이 인스타그램 대시보드</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --card: #ffffff;
        --line: #d9e1ec;
        --text: #1f2937;
        --muted: #5b6472;
        --accent: #b45309;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Noto Sans KR", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
      }
      main { max-width: 860px; margin: 0 auto; padding: 48px 20px 80px; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.06);
      }
      .badge {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(180, 83, 9, 0.12);
        color: var(--accent);
        font-weight: 700;
        font-size: 14px;
      }
      h1 { margin: 18px 0 10px; font-size: clamp(32px, 5vw, 48px); line-height: 1.15; }
      p, li { color: var(--muted); font-size: 16px; }
      ul { padding-left: 20px; }
      .meta { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <span class="badge">데이터 삭제 안내</span>
        <h1>계정 연결 해제 및 데이터 삭제 요청</h1>
        <p>사용자는 언제든지 데이터 삭제를 요청할 수 있습니다.</p>
        <ul>
          <li>삭제 요청 이메일: atrox42@naver.com</li>
          <li>메일 제목 예시: 데이터 삭제 요청</li>
          <li>삭제 대상 확인을 위해 Instagram 계정명 또는 연결 계정 식별 정보를 함께 전달해 주세요.</li>
        </ul>
        <p>요청 확인 후 합리적인 기간 내 관련 정보를 삭제합니다.</p>

        <div class="meta">
          문의 이메일: atrox42@naver.com<br />
          시행일: 2026-03-31
        </div>
      </section>
    </main>
  </body>
</html>
