services:
  db:
    image: postgres:16-alpine
    container_name: ig-cleanup-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: instagram_cleanup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ig-cleanup-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
      SUPABASE_DB_URL: postgresql+psycopg://postgres:postgres@db:5432/instagram_cleanup
      SUPABASE_SERVICE_ROLE_KEY: local-dev
      INSTAGRAM_APP_SECRET: mock-secret
      INSTAGRAM_VERIFY_TOKEN: mock-verify-token
      SCHEDULER_ENABLED: "true"
      MOCK_DATA_MODE: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ig-cleanup-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_MOCK_DATA_MODE: "false"
      ENABLE_LEGACY_LOGIN: "true"
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:-}
      INSTAGRAM_LOGIN_URL: ${INSTAGRAM_LOGIN_URL:-}
      INSTAGRAM_APP_SCOPES: ${INSTAGRAM_APP_SCOPES:-instagram_business_basic}
      APP_LOGIN_USERNAME: ${APP_LOGIN_USERNAME:-admin}
      APP_LOGIN_PASSWORD: ${APP_LOGIN_PASSWORD:-admin1234}
      APP_LOGIN_USERNAME_YOU: ${APP_LOGIN_USERNAME_YOU:-admin}
      APP_LOGIN_PASSWORD_YOU: ${APP_LOGIN_PASSWORD_YOU:-admin1234}
      APP_DISPLAY_NAME_YOU: ${APP_DISPLAY_NAME_YOU:-규석}
      APP_INSTAGRAM_HANDLE_YOU: ${APP_INSTAGRAM_HANDLE_YOU:-@admin}
      APP_LOGIN_USERNAME_WIFE: ${APP_LOGIN_USERNAME_WIFE:-admin2}
      APP_LOGIN_PASSWORD_WIFE: ${APP_LOGIN_PASSWORD_WIFE:-admin1234}
      APP_DISPLAY_NAME_WIFE: ${APP_DISPLAY_NAME_WIFE:-다혜}
      APP_INSTAGRAM_HANDLE_WIFE: ${APP_INSTAGRAM_HANDLE_WIFE:-@admin2}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-secret}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
