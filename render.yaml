databases:
  - name: acg-wang-db
    databaseName: instagram_cleanup
    user: instagram_cleanup
    plan: free

services:
  - type: web
    name: acg-wang-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      - key: PORT
        value: 8000
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: MOCK_DATA_MODE
        value: "false"
      - key: SUPABASE_DB_URL
        fromDatabase:
          name: acg-wang-db
          property: connectionString
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_VERIFY_TOKEN
        sync: false
